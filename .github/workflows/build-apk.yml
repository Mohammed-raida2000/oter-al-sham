
name: Build Oter Al-Sham APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Locate Flutter Project
        id: locate
        shell: bash
        run: |
          if [ -f "pubspec.yaml" ] && [ -d "lib" ]; then
            echo "project_dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "mobile/pubspec.yaml" ] && [ -d "mobile/lib" ]; then
            echo "project_dir=mobile" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Flutter project not found."
            echo "Expected pubspec.yaml and lib/main.dart in root or mobile/"
            echo "Repository files:"
            find . -maxdepth 3 \( -name pubspec.yaml -o -name main.dart \) -print
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter Project
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          flutter --version

      - name: Install Dependencies
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter pub get

      - name: Build Release APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter build apk --release

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: oter-al-sham-apk
          path: ${{ steps.locate.outputs.project_dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
